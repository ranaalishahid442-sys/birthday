<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="waxGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff9ec2"/>
      <stop offset="35%" stop-color="#ff5e9c"/>
      <stop offset="70%" stop-color="#d81b60"/>
      <stop offset="100%" stop-color="#880e4f"/>
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8db"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <filter id="waxShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#880e4f" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Organic Wax Drips -->
  <path d="M80,12 C105,10 120,25 135,40 C150,55 155,75 150,100 C145,125 125,145 95,150 C65,155 35,145 20,125 C5,105 8,75 18,50 C28,25 55,14 80,12 Z" 
        fill="url(#waxGrad)" filter="url(#waxShadow)"/>

  <!-- Inner Concentric Wax Ridge -->
  <circle cx="80" cy="80" r="54" fill="none" stroke="url(#goldRim)" stroke-width="2.5" stroke-dasharray="6,3" opacity="0.85"/>
  <circle cx="80" cy="80" r="48" fill="#c2185b" opacity="0.6"/>

  <!-- Floral Laurel Wreath -->
  <g fill="none" stroke="url(#goldRim)" stroke-width="1.8" stroke-linecap="round">
    <path d="M50,95 C45,75 52,55 68,46"/>
    <path d="M110,95 C115,75 108,55 92,46"/>
    <!-- Laurel Leaves -->
    <path d="M48,82 Q42,78 48,74 Q54,78 48,82 Z" fill="url(#goldRim)"/>
    <path d="M52,66 Q47,60 54,58 Q58,64 52,66 Z" fill="url(#goldRim)"/>
    <path d="M112,82 Q118,78 112,74 Q106,78 112,82 Z" fill="url(#goldRim)"/>
    <path d="M108,66 Q113,60 106,58 Q102,64 108,66 Z" fill="url(#goldRim)"/>
  </g>

  <!-- Crown / Monogram "20" & Heart -->
  <g fill="url(#goldRim)">
    <!-- Small Coronet -->
    <path d="M68,52 L73,57 L80,48 L87,57 L92,52 L90,60 L70,60 Z"/>
    <circle cx="80" cy="46" r="2"/>
    <!-- Heart Monogram -->
    <path d="M80,88 C80,88 64,74 64,66 C64,61 68,57 73,57 C76,57 79,59 80,62 C81,59 84,57 87,57 C92,57 96,61 96,66 C96,74 80,88 80,88 Z" fill="#ffd700"/>
    <!-- The "20" Text -->
    <text x="80" y="108" font-family="'Playfair Display', serif" font-size="16" font-weight="bold" text-anchor="middle" fill="url(#goldRim)" letter-spacing="1">20th</text>
  </g>
</svg>
