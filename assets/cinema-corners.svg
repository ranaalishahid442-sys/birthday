<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%" preserveAspectRatio="xMidYMin slice">
  <defs>
    <!-- Fairy Light Glow Filter -->
    <filter id="lightGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Balloon Gradients -->
    <radialGradient id="balloonPink" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#ff9ec2"/>
      <stop offset="70%" stop-color="#ff5e9c"/>
      <stop offset="100%" stop-color="#d81b60"/>
    </radialGradient>

    <radialGradient id="balloonGold" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff8db"/>
      <stop offset="30%" stop-color="#ffe277"/>
      <stop offset="75%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#c59b27"/>
    </radialGradient>

    <radialGradient id="balloonCream" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fff5eb"/>
      <stop offset="85%" stop-color="#fedac2"/>
      <stop offset="100%" stop-color="#e8a88a"/>
    </radialGradient>

    <!-- Fairy Light Bulb Gradient -->
    <radialGradient id="bulbGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fff59d"/>
      <stop offset="80%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </radialGradient>
  </defs>

  <!-- ═══════════════════════════════════════════
       1. TOP-CENTER: DRAPED FAIRY LIGHTS STRING
       ═══════════════════════════════════════════ -->
  <g id="fairyLights">
    <!-- Curved Draped Wire -->
    <path d="M0,8 Q250,55 500,14 Q750,55 1000,8" fill="none" stroke="rgba(255, 235, 180, 0.45)" stroke-width="1.8"/>

    <!-- Glowing Fairy Light Bulbs with Glow -->
    <g filter="url(#lightGlow)">
      <!-- Left Draping Bulbs -->
      <circle cx="120" cy="28" r="6" fill="url(#bulbGrad)"/>
      <circle cx="240" cy="46" r="6.5" fill="url(#bulbGrad)"/>
      <circle cx="360" cy="38" r="6" fill="url(#bulbGrad)"/>

      <!-- Center Dip -->
      <circle cx="500" cy="18" r="7" fill="url(#bulbGrad)"/>

      <!-- Right Draping Bulbs -->
      <circle cx="640" cy="38" r="6" fill="url(#bulbGrad)"/>
      <circle cx="760" cy="46" r="6.5" fill="url(#bulbGrad)"/>
      <circle cx="880" cy="28" r="6" fill="url(#bulbGrad)"/>
    </g>

    <!-- Little Bulb Sockets -->
    <g fill="#a17822">
      <rect x="118" y="21" width="4" height="3" rx="1"/>
      <rect x="238" y="38" width="4" height="3" rx="1"/>
      <rect x="358" y="31" width="4" height="3" rx="1"/>
      <rect x="498" y="11" width="4" height="3" rx="1"/>
      <rect x="638" y="31" width="4" height="3" rx="1"/>
      <rect x="758" y="38" width="4" height="3" rx="1"/>
      <rect x="878" y="21" width="4" height="3" rx="1"/>
    </g>
  </g>

  <!-- ═══════════════════════════════════════════
       2. TOP-LEFT CORNER: BALLOON BOUQUET & "20"
       ═══════════════════════════════════════════ -->
  <g id="topLeftCorner">
    <!-- Balloon Strings -->
    <path d="M55,90 Q45,150 70,210" fill="none" stroke="#e0c068" stroke-width="1.2" opacity="0.6"/>
    <path d="M95,80 Q80,140 70,210" fill="none" stroke="#e0c068" stroke-width="1.2" opacity="0.6"/>
    <path d="M125,95 Q100,160 70,210" fill="none" stroke="#e0c068" stroke-width="1.2" opacity="0.6"/>

    <!-- Balloon 1 (Cream Heart) -->
    <g transform="translate(10, 10)">
      <ellipse cx="45" cy="50" rx="30" ry="36" fill="url(#balloonCream)"/>
      <polygon points="42,86 48,86 45,92" fill="#e8a88a"/>
    </g>

    <!-- Balloon 2 (Rose Gold Heart/Round) -->
    <g transform="translate(60, 5)">
      <ellipse cx="40" cy="45" rx="32" ry="38" fill="url(#balloonPink)"/>
      <polygon points="37,83 43,83 40,89" fill="#d81b60"/>
    </g>

    <!-- Balloon 3 (Gold Sparkle) -->
    <g transform="translate(95, 25)">
      <ellipse cx="32" cy="38" rx="26" ry="32" fill="url(#balloonGold)"/>
      <polygon points="29,70 35,70 32,75" fill="#c59b27"/>
    </g>

    <!-- Floating "20" Rosette Badge -->
    <g transform="translate(50, 140)">
      <circle cx="20" cy="20" r="18" fill="url(#balloonGold)" stroke="#ffffff" stroke-width="2" filter="url(#lightGlow)"/>
      <text x="20" y="26" font-family="'Playfair Display', serif" font-size="16" font-weight="bold" fill="#7a5500" text-anchor="middle">20</text>
    </g>
  </g>

  <!-- ═══════════════════════════════════════════
       3. TOP-RIGHT CORNER: BLOOMING ROSES & CONFETTI
       ═══════════════════════════════════════════ -->
  <g id="topRightCorner" transform="translate(820, 0)">
    <!-- Confetti Streamers (Swirls) -->
    <path d="M140,0 Q110,60 135,110 Q110,160 130,200" fill="none" stroke="#ffd700" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M100,0 Q70,50 95,95 Q75,140 85,180" fill="none" stroke="#ff75a0" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

    <!-- Green Leaves -->
    <path d="M110,35 Q135,20 145,45 Q125,55 110,35 Z" fill="#4caf50" opacity="0.85"/>
    <path d="M75,55 Q50,45 55,75 Q80,75 75,55 Z" fill="#388e3c" opacity="0.85"/>

    <!-- Rose 1 (Deep Pink) -->
    <g transform="translate(100, 20)">
      <circle cx="30" cy="30" r="26" fill="url(#balloonPink)"/>
      <path d="M22,25 Q30,14 38,25 Q30,38 22,25 Z" fill="#ff75a0"/>
      <circle cx="30" cy="30" r="12" fill="#d81b60"/>
      <circle cx="30" cy="30" r="6" fill="#fff"/>
    </g>

    <!-- Rose 2 (Soft Ivory Rose) -->
    <g transform="translate(45, 10)">
      <circle cx="24" cy="24" r="20" fill="url(#balloonCream)"/>
      <circle cx="24" cy="24" r="10" fill="#ffb8d2"/>
      <circle cx="24" cy="24" r="4" fill="#fff"/>
    </g>

    <!-- Twinkling Golden Stars -->
    <g fill="#ffd700" opacity="0.9">
      <!-- Star 1 -->
      <polygon points="40,95 43,103 52,103 45,108 48,116 40,111 32,116 35,108 28,103 37,103"/>
      <!-- Star 2 -->
      <polygon points="120,135 122,141 128,141 123,145 125,151 120,147 115,151 117,145 112,141 118,141"/>
    </g>
  </g>
</svg>
