<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 380" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="cakeStandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cf9e28"/>
      <stop offset="30%" stop-color="#ffe885"/>
      <stop offset="70%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>

    <linearGradient id="tierBottomGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5f8"/>
      <stop offset="40%" stop-color="#ffd6e4"/>
      <stop offset="100%" stop-color="#ffb8cf"/>
    </linearGradient>

    <linearGradient id="tierTopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#fff0f5"/>
      <stop offset="100%" stop-color="#ffd1e0"/>
    </linearGradient>

    <linearGradient id="dripGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff75a0"/>
      <stop offset="100%" stop-color="#e84393"/>
    </linearGradient>

    <linearGradient id="goldNumberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9db"/>
      <stop offset="40%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>

    <radialGradient id="flameGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fff176"/>
      <stop offset="60%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#f44336" stop-opacity="0"/>
    </radialGradient>

    <filter id="glowEffect" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Golden Pedestal Stand -->
  <g id="cakeStand">
    <ellipse cx="170" cy="355" rx="140" ry="18" fill="url(#cakeStandGrad)"/>
    <path d="M145,355 L150,335 L190,335 L195,355 Z" fill="url(#cakeStandGrad)"/>
    <ellipse cx="170" cy="335" rx="155" ry="14" fill="url(#cakeStandGrad)"/>
    <ellipse cx="170" cy="333" rx="150" ry="10" fill="#fff8e7" opacity="0.4"/>
  </g>

  <!-- Bottom Tier (Diameter 240, Height 95) -->
  <g id="tierBottom">
    <path d="M50,240 C50,230 70,225 170,225 C270,225 290,230 290,240 L290,325 C290,338 240,345 170,345 C100,345 50,338 50,325 Z" 
          fill="url(#tierBottomGrad)"/>
    <!-- Bottom Icing Pearls -->
    <g fill="#ffffff" opacity="0.9">
      <circle cx="65" cy="326" r="6"/><circle cx="85" cy="329" r="6"/><circle cx="105" cy="332" r="6"/>
      <circle cx="125" cy="334" r="6"/><circle cx="145" cy="335" r="6"/><circle cx="165" cy="336" r="6"/>
      <circle cx="185" cy="336" r="6"/><circle cx="205" cy="335" r="6"/><circle cx="225" cy="334" r="6"/>
      <circle cx="245" cy="332" r="6"/><circle cx="265" cy="329" r="6"/><circle cx="280" cy="326" r="6"/>
    </g>
    <!-- Rosettes & Gold Pearls on Bottom Tier -->
    <text x="170" y="295" font-family="'Great Vibes', cursive" font-size="27" fill="#e84393" text-anchor="middle" opacity="0.9">Happy 20th, Iqra</text>
  </g>

  <!-- Top Tier (Diameter 180, Height 75) -->
  <g id="tierTop">
    <path d="M80,155 C80,146 100,140 170,140 C240,140 260,146 260,155 L260,230 C260,240 220,246 170,246 C120,246 80,240 80,230 Z" 
          fill="url(#tierTopGrad)"/>
    
    <!-- Berry Frosting Drips -->
    <path d="M80,155 
             Q90,180 100,165 
             Q110,195 125,170 
             Q140,205 155,168 
             Q170,210 185,166 
             Q200,195 215,165 
             Q230,200 245,168 
             Q255,185 260,155 
             L260,150 C260,142 220,136 170,136 C120,136 80,142 80,150 Z" 
          fill="url(#dripGrad)"/>

    <!-- Macarons & Fresh Strawberries on Cake Shoulder -->
    <g id="toppings">
      <!-- Strawberry Left -->
      <path d="M92,142 C85,130 100,122 108,135 C112,142 100,152 92,142 Z" fill="#e81123"/>
      <polygon points="100,126 104,122 108,126 106,128 102,128" fill="#2ecc71"/>
      <!-- Macaron Right -->
      <ellipse cx="242" cy="142" rx="14" ry="7" fill="#ff75a0"/>
      <ellipse cx="242" cy="138" rx="13" ry="6" fill="#ffeaa7"/>
      <ellipse cx="242" cy="135" rx="14" ry="7" fill="#ff75a0"/>
    </g>
  </g>

  <!-- Number "20" Golden Candles with Flames -->
  <g id="candles20">
    <!-- Candle 2 -->
    <text x="142" y="115" font-family="'Playfair Display', serif" font-size="64" font-weight="bold" fill="url(#goldNumberGrad)" text-anchor="middle" filter="drop-shadow(0 3px 6px rgba(0,0,0,0.3))">2</text>
    
    <!-- Candle 0 -->
    <text x="198" y="115" font-family="'Playfair Display', serif" font-size="64" font-weight="bold" fill="url(#goldNumberGrad)" text-anchor="middle" filter="drop-shadow(0 3px 6px rgba(0,0,0,0.3))">0</text>

    <!-- Candle Wicks -->
    <line x1="142" y1="62" x2="142" y2="52" stroke="#444" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="198" y1="62" x2="198" y2="52" stroke="#444" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Animated Flames with Filter -->
    <g id="flamesGroup" filter="url(#glowEffect)">
      <!-- Flame 2 -->
      <path id="flameLeft" d="M142,52 C134,44 135,32 142,22 C149,32 150,44 142,52 Z" fill="url(#flameGlow)"/>
      <ellipse cx="142" cy="42" rx="3.5" ry="6" fill="#ffffff" opacity="0.9"/>

      <!-- Flame 0 -->
      <path id="flameRight" d="M198,52 C190,44 191,32 198,22 C205,32 206,44 198,52 Z" fill="url(#flameGlow)"/>
      <ellipse cx="198" cy="42" rx="3.5" ry="6" fill="#ffffff" opacity="0.9"/>
    </g>
  </g>
</svg>
